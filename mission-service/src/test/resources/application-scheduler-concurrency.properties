# Both scheduler instances share this PostgreSQL schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/mission_test_db?currentSchema=scheduler_concurrency_test
spring.flyway.default-schema=scheduler_concurrency_test
spring.flyway.schemas=scheduler_concurrency_test
spring.jpa.properties.hibernate.default_schema=scheduler_concurrency_test

# The test triggers each scheduler explicitly and allows one assignment per run.
mission.scheduler.enabled=false
mission.scheduler.max-assignments-per-run=1

# Delay background workers so they cannot change assignments during the test.
mission.assignment.recovery.initial-delay-ms=3600000
mission.offline.initial-delay-ms=3600000
mission.recovery.finalization.initial-delay-ms=3600000