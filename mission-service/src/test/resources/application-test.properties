spring.datasource.url=jdbc:postgresql://localhost:5432/mission_test_db
spring.datasource.username=${MISSION_TEST_DB_USERNAME:${MISSION_DB_USERNAME:postgres}}
spring.datasource.password=${MISSION_TEST_DB_PASSWORD:${MISSION_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

mission.scheduler.enabled=false
mission.scheduler.initial-delay-ms=3600000
mission.scheduler.delay-ms=3600000

mission.assignment.recovery.initial-delay-ms=3600000
mission.assignment.recovery.delay-ms=3600000

mission.offline.initial-delay-ms=3600000
mission.offline.delay-ms=3600000

mission.recovery.finalization.initial-delay-ms=3600000
mission.recovery.finalization.delay-ms=3600000