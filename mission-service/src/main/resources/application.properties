
spring.application.name=mission-service
server.port=${MISSION_SERVER_PORT:8082}

# PostgreSQL
spring.datasource.url=${MISSION_DB_URL:jdbc:postgresql://localhost:5432/mission_db}
spring.datasource.username=${MISSION_DB_USERNAME:postgres}
spring.datasource.password=${MISSION_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Fleet Service Integration
fleet.service.base-url=${FLEET_SERVICE_BASE_URL:http://localhost:8081}
fleet.service.connect-timeout=${FLEET_CONNECT_TIMEOUT:2s}
fleet.service.read-timeout=${FLEET_READ_TIMEOUT:5s}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html