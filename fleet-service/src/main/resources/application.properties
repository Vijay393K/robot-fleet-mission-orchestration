
spring.application.name=fleet-service
server.port=${FLEET_SERVER_PORT:8081}

# PostgreSQL
spring.datasource.url=${FLEET_DB_URL:jdbc:postgresql://localhost:5432/fleet_db}
spring.datasource.username=${FLEET_DB_USERNAME:postgres}
spring.datasource.password=${FLEET_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html